{% set name = "metatensor-learn" %}
{% set version = "0.6.2" %}

package:
  name: python-{{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/metatensor_learn-{{ version }}.tar.gz
  sha256: 5a9fa1c8173206005f80ade049b60fcde5d4c19d05f388243694aab88f182602

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=68
    - packaging >=23
    - pip
  run:
    - python >={{ python_min }}
    - python-metatensor-operations >=0.5.0,<0.6

test:
  imports:
    - metatensor.learn
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/metatensor/metatensor
  summary: Building blocks for the atomistic machine learning models based on PyTorch and NumPy
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  doc_url: https://docs.metatensor.org

extra:
  recipe-maintainers:
    - HaoZeke
    - PicoCentauri
    - Luthaf
